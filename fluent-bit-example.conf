# ==============================================================================
# AI Forensics Triage Framework - Fluent Bit Agent Configuration (Template)
# ==============================================================================
# INSTRUCTIONS:
# 1. Choose the [INPUT] and [OUTPUT] blocks that match your target node (VMware/Local or AWS).
# 2. Replace <YOUR_FLASK_SERVER_IP> with the IP/Hostname of your Flask SOC dashboard.
# 3. Replace <YOUR_DATADOG_API_KEY> if using the Datadog integration.
# ==============================================================================

[SERVICE]
    Flush         2
    Daemon        Off
    Log_Level     info

# ------------------------------------------------------------------------------
# INPUTS: Select the logs relevant to your node
# ------------------------------------------------------------------------------

# Example A: Standard Linux Auth & Syslog (Kali / Ubuntu / Debian)
[INPUT]
    Name          tail
    Path          /var/log/syslog,/var/log/auth.log
    Tag           node.system
    Refresh_Interval 2

# Example B: AWS EC2 Amazon Linux / RHEL Auth Logs
[INPUT]
    Name          tail
    Path          /var/log/secure,/var/log/messages
    Tag           node.system
    Refresh_Interval 2

# Example C: Web Server Access Logs (Nginx)
[INPUT]
    Name          tail
    Path          /var/log/nginx/access.log
    Tag           node.web
    Parser        nginx
    Refresh_Interval 2

# ------------------------------------------------------------------------------
# FILTERS: Noise Reduction & Anti-Looping
# ------------------------------------------------------------------------------

[FILTER]
    Name          grep
    Match         node.system
    # Only forward lines indicating potential security events or failures
    Regex         log (?i)(error|fail|warn|critical|fatal|denied|unauthorized|anomaly)
    # CRITICAL: Prevent self-ingestion loops by ignoring Fluent Bit's own telemetry
    Exclude       log (?i)fluent-bit

# ------------------------------------------------------------------------------
# OUTPUTS: Routing telemetry to your SIEM & AI Engine
# ------------------------------------------------------------------------------

# Route 1: Local VMware / Kali Node to Flask Dashboard
[OUTPUT]
    Name          http
    Match         node.*
    Host          <YOUR_FLASK_SERVER_IP>
    Port          5000
    URI           /logs/vmware
    Format        json

# Route 2: AWS EC2 Cloud Node to Flask Dashboard (via Tailscale/Ngrok)
# Note: If using Ngrok HTTPS, set Port to 443 and tls to On.
[OUTPUT]
    Name          http
    Match         node.*
    Host          <YOUR_FLASK_SERVER_IP>
    Port          5000
    URI           /logs/aws_ec2
    Format        json
    # tls         On 

# Route 3: Optional Datadog Integration
[OUTPUT]
    Name             datadog
    Match            node.*
    Host             http-intake.logs.datadoghq.com
    TLS              on
    compress         gzip
    apikey           <YOUR_DATADOG_API_KEY>
    dd_service       ai-forensics-agent
    dd_source        linux
    dd_message_key   log
    dd_tags          env:production, framework:ai-triage
